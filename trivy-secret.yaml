# 9router custom Trivy secret allow rules
allow-rules:
  - id: allow-known-test-token
    description: "Known test fixture token"
    regex: '^fake-test-[a-z0-9-]+$'

  - id: allow-gitlab-pat-placeholder
    description: "Allow UI placeholder for GitLab Personal Access Token"
    regex: '^["'']?glpat-x+$'
