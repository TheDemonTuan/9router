services:
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:0.38.0@sha256:14e3dda1f041eef509af850ac7a32647d1c3e5d9bd66e3e8655dfd3a398273af
    container_name: 9router-headroom
    restart: unless-stopped
    expose:
      - "8787"
    networks:
      - internal
    environment:
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      HEADROOM_SKIP_UPSTREAM_CHECK: "1"
      HEADROOM_DISABLE_KOMPRESS: "1"
      HEADROOM_DISABLE_KOMPRESS_FALLBACK: "1"
      HEADROOM_TOOL_SEARCH: "0"
      HEADROOM_OUTPUT_SHAPER: "0"
      HEADROOM_MODEL_ROUTER_ENABLED: "0"
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  9router-blue:
    image: ${IMAGE_REF:-decolua/9router:latest}
    container_name: 9router-blue
    restart: unless-stopped
    expose:
      - "20128"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      DEPLOY_SLOT: blue
      NODE_ENV: production
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?INITIAL_PASSWORD must be set for production}
      HEADROOM_URL: http://9router-headroom:8787
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DASHBOARD_HOST:-9router-admin.tuannguyenviet.site}}
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL:-https://${DASHBOARD_HOST:-9router-admin.tuannguyenviet.site}}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-9router-admin.tuannguyenviet.site}
      API_HOST: ${API_HOST:-9router-api.tuannguyenviet.site}
      CLOUDFLARE_ACCESS_TEAM_NAME: ${CLOUDFLARE_ACCESS_TEAM_NAME:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
    volumes:
      - 9router-data:/app/data
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20128/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  9router-green:
    image: ${IMAGE_REF:-decolua/9router:latest}
    container_name: 9router-green
    restart: unless-stopped
    expose:
      - "20128"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      DEPLOY_SLOT: green
      NODE_ENV: production
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?INITIAL_PASSWORD must be set for production}
      HEADROOM_URL: http://9router-headroom:8787
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DASHBOARD_HOST:-9router-admin.tuannguyenviet.site}}
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL:-https://${DASHBOARD_HOST:-9router-admin.tuannguyenviet.site}}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-9router-admin.tuannguyenviet.site}
      API_HOST: ${API_HOST:-9router-api.tuannguyenviet.site}
      CLOUDFLARE_ACCESS_TEAM_NAME: ${CLOUDFLARE_ACCESS_TEAM_NAME:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
    volumes:
      - 9router-data:/app/data
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20128/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-edge-9router}
  internal:
    driver: bridge

volumes:
  9router-data:
    name: 9router-data
