services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
      HEADROOM_DEFAULT_TIMEOUT_MS: ${HEADROOM_DEFAULT_TIMEOUT_MS:-}
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:0.38.0
    container_name: headroom
    restart: always
    expose:
      - "8787"
    environment:
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      HEADROOM_SKIP_UPSTREAM_CHECK: "1"
      HEADROOM_DISABLE_KOMPRESS: "1"
      HEADROOM_DISABLE_KOMPRESS_FALLBACK: "1"
      HEADROOM_TOOL_SEARCH: "0"
      HEADROOM_OUTPUT_SHAPER: "0"
      HEADROOM_MODEL_ROUTER_ENABLED: "0"
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  9router-data:
    name: 9router-data
