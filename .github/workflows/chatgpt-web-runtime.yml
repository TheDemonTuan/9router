name: ChatGPT Web runtime gates
on:
  push:
    branches: [feat/cgw-full-harness, integrate/cgw-production, master]
  pull_request:
    paths:
      - services/chatgpt-web-runtime/**
      - open-sse/services/chatgptWebRuntimeClient.js
      - open-sse/executors/chatgpt-web.js
      - src/lib/chatgptWebAuthority.js
      - src/sse/**
      - src/app/api/v1/**
      - tests/integration/chatgpt-web-runtime-smoke.mjs
      - .github/workflows/chatgpt-web-runtime.yml
  workflow_dispatch:
    inputs:
      live_account:
        type: boolean
        default: false
        description: Run operator-provisioned real-account gate on protected disposable staging ARM64
      publish:
        type: boolean
        default: false
        description: Publish a native evidence-bearing ARM64 image after offline and security gates
      deploy:
        type: boolean
        default: false
        description: Deploy the scanned immutable runtime after operator bootstrap/enrollment
permissions:
  contents: read
concurrency:
  group: cgw-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  activation-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce explicit default-branch activation
        env:
          PUBLISH: ${{ inputs.publish || false }}
          DEPLOY: ${{ inputs.deploy || false }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true || "$DEPLOY" == true ]]; then
            [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] || { echo 'Publication and deployment require the default branch' >&2; exit 1; }
          fi
          [[ "$DEPLOY" != true || "$PUBLISH" == true ]] || { echo 'Deploy requires this run to publish and scan its immutable image' >&2; exit 1; }

  gateway-contracts:
    needs: activation-fence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Isolate gateway contract state
        run: |
          set -euo pipefail
          state_home="$RUNNER_TEMP/cgw-gateway-contracts"
          mkdir -p "$state_home/data"
          printf 'HOME=%s\nUSERPROFILE=%s\nAPPDATA=%s\nDATA_DIR=%s/data\nCGW_DATA_DIR=%s/data\nENABLE_REQUEST_LOGS=false\nNEXT_TELEMETRY_DISABLED=1\n' "$state_home" "$state_home" "$state_home" "$state_home" "$state_home" >> "$GITHUB_ENV"
      - name: Install frozen gateway and test dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd tests
      - name: Exercise all affected CGW gateway and dashboard contracts
        working-directory: tests
        run: |
          set -euo pipefail
          bun run test --config vitest.config.js \
            integration/chatgpt-web.test.js \
            unit/chatgpt-web-concurrency.test.js \
            unit/chatgpt-web-executor-capabilities.test.js \
            unit/session-manager.test.js \
            unit/chat-quota-handler.test.js \
            unit/providers-chatgpt-web-crud.test.js \
            unit/provider-validation-chatgpt-web.test.js \
            unit/provider-models-chatgpt-web.test.js \
            unit/models-route-chatgpt-web.test.js \
            unit/v1-models-chatgpt-web.test.js \
            unit/chatgpt-web-connection-test.test.js \
            unit/force-stream-config.test.js \
            unit/responses-native-forwarding.test.js \
            unit/dashboard-guard.test.js \
            unit/chatgpt-web-runtime-admin.test.js
      - name: Exercise real disposable Bun SQLite profile migration
        run: bun tests/integration/chatgpt-web-profile-migration-smoke.mjs
      - name: Preserve current production regression contracts
        run: bash .deploy/verify.sh

  native:
    needs: activation-fence
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      ENABLE_REQUEST_LOGS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Isolate offline state
        shell: bash
        run: |
          set -euo pipefail
          state_home="$RUNNER_TEMP/cgw-offline-home"
          mkdir -p "$state_home/data"
          printf 'HOME=%s\nUSERPROFILE=%s\nAPPDATA=%s\nDATA_DIR=%s/data\nCGW_DATA_DIR=%s/data\n' "$state_home" "$state_home" "$state_home" "$state_home" "$state_home" >> "$GITHUB_ENV"
      - name: Check frozen runtime types, behavior and entrypoint closure
        working-directory: services/chatgpt-web-runtime
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.0
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          python3 -B -m unittest discover -s tests -p install_browser_test.py
          bun build src/server.ts src/companion/main.ts --target bun --external playwright-core --outdir "$RUNNER_TEMP/cgw-entrypoints"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load native image without emulation or push
        env:
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) echo 'Native runner mismatch' >&2; exit 1;; esac
          image="ghcr.io/thedemontuan/9router-cgw-runtime:${REVISION}-${ARCH}"
          docker buildx build --load --platform "linux/$ARCH" --build-arg "APP_REVISION=$REVISION" \
            -f services/chatgpt-web-runtime/Dockerfile -t "$image" .
          echo "CGW_CHECK_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Provision official Chrome privately from pinned Google download
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          browser="$RUNNER_TEMP/cgw-browser"
          python3 services/chatgpt-web-runtime/scripts/install-browser.py \
            --manifest services/chatgpt-web-runtime/image-build-manifest.json --arch "$ARCH" --output "$browser"
          echo "CGW_BROWSER_DIR=$browser" >> "$GITHUB_ENV"
      - name: Prove physical sandbox, native binaries and actual browser HTTP fixture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          hardening=(--rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true
            --security-opt "seccomp=$PWD/services/chatgpt-web-runtime/security/seccomp.json" --shm-size 1g
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777
            --tmpfs /run:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
            --tmpfs /data:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700
            --mount "type=bind,src=$CGW_BROWSER_DIR,dst=/opt/cgw-browser,readonly")
          echo "=== 1. image-smoke ==="
          docker run "${hardening[@]}" "$CGW_CHECK_IMAGE" bun scripts/image-smoke.ts --arch "$ARCH"
          echo "=== 2. verify-harness-compatibility ==="
          docker run "${hardening[@]}" "$CGW_CHECK_IMAGE" bun scripts/verify-harness-compatibility.ts /data/compatibility.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Build isolated gateway and exercise real companion HTTP cutover
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.2
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd tests
          bun run build
          bun tests/integration/chatgpt-web-runtime-smoke.mjs --image "$CGW_CHECK_IMAGE" --browser-dir "$CGW_BROWSER_DIR" --gateway-port 21127
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheDemonTuan/vps-deploy
          ref: 4b1e1692006df83c93da05ea9e7bf285ccf94138
          path: platform
          persist-credentials: false
      - name: Scan runtime and privately mounted browser without suppression
        run: |
          set -euo pipefail
          sudo bash platform/scripts/install-trivy.sh /usr/local/bin
          trivy image --scanners vuln --ignorefile /dev/null --severity HIGH,CRITICAL --exit-code 1 "$CGW_CHECK_IMAGE"
          sudo bash platform/scripts/install-grype.sh /usr/local/bin
          python3 platform/scripts/scan-private-browser.py --sbom "$CGW_BROWSER_DIR/browser.spdx.json" \
            --report "$RUNNER_TEMP/grype-browser.json"
      # No registry login, push, account-state artifact upload, reusable old platform
      # Trivy call, deploy action, or production manifest/pin mutation belongs here.

  live-staging:
    needs: [native, gateway-contracts]
    if: github.event_name == 'workflow_dispatch' && inputs.live_account && github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, linux, ARM64, cgw-staging-disposable]
    environment: staging
    timeout-minutes: 60
    env:
      CGW_LIVE: '1'
      CGW_STAGING_CONFIG_FILE: ${{ vars.CGW_STAGING_CONFIG_FILE }}
      CGW_STAGING_PROFILE: ${{ vars.CGW_STAGING_PROFILE }}
      ENABLE_REQUEST_LOGS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Require operator-owned private staging prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(bun --version)" = 1.4.0
          test -n "$CGW_STAGING_PROFILE"
          test -n "$CGW_STAGING_CONFIG_FILE"
          test -f "$CGW_STAGING_CONFIG_FILE"
          test -r "$CGW_STAGING_CONFIG_FILE"
          # Secret files/login/connector/Codex workspace are provisioned out of band
          # on this disposable runner; never materialize them from PR input or artifacts.
      - name: Exercise real account and local Codex harness
        working-directory: services/chatgpt-web-runtime
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run smoke:live -- --profile "$CGW_STAGING_PROFILE"
      # No account screenshots, browser/rollout state, keys, or private config uploads.

  security-source:
    name: Trivy CGW source gate
    needs: [native, gateway-contracts]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: read
    uses: TheDemonTuan/vps-deploy/.github/workflows/security-trivy.yml@f6d40a519c2bf8b0a19e3f9c714b737875052870
    with:
      app: 9router
      source-sha: ${{ github.sha }}
      platform-ref: f6d40a519c2bf8b0a19e3f9c714b737875052870
      config: .deploy/app.yml
      scan-mode: source

  publish:
    name: Publish verified native CGW image
    needs: security-source
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
    uses: TheDemonTuan/vps-deploy/.github/workflows/build-docker.yml@f6d40a519c2bf8b0a19e3f9c714b737875052870
    with:
      app: 9router
      component: cgw
      source-sha: ${{ github.sha }}
      platform-ref: f6d40a519c2bf8b0a19e3f9c714b737875052870
      config: .deploy/app.yml

  security-image:
    name: Trivy immutable CGW image gate
    needs: publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: read
    uses: TheDemonTuan/vps-deploy/.github/workflows/security-trivy.yml@f6d40a519c2bf8b0a19e3f9c714b737875052870
    with:
      app: 9router
      source-sha: ${{ github.sha }}
      platform-ref: f6d40a519c2bf8b0a19e3f9c714b737875052870
      config: .deploy/app.yml
      scan-mode: image
      image-ref: ${{ needs.publish.outputs.image-ref }}
      platform: linux/arm64

  deploy-runtime:
    name: Deploy scanned immutable CGW runtime
    needs: [publish, security-image]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.deploy && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 34
    steps:
      - uses: TheDemonTuan/vps-deploy/.github/actions/deploy@f6d40a519c2bf8b0a19e3f9c714b737875052870
        with:
          app: 9router
          host: oracle-main
          operation: deploy
          component: cgw
          source-sha: ${{ github.sha }}
          platform-ref: f6d40a519c2bf8b0a19e3f9c714b737875052870
          config: .deploy/app.yml
          image-ref: ${{ needs.publish.outputs.image-ref }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
