name: ChatGPT Web runtime gates
on:
  push:
    branches: [feat/chatgpt-web-experience]
  # Master pushes run these gates through Build and Deploy, once per source SHA.
  workflow_call:
    inputs:
      verification_only:
        type: boolean
        default: true
        description: Run offline gates only; never activate live accounts, publication or deployment
  pull_request:
    paths:
      - services/chatgpt-web-runtime/**
      - tools/chatgpt-web-session-export/**
      - src/**
      - open-sse/**
      - public/**
      - tests/**
      - .deploy/**
      - package.json
      - bun.lock
      - Dockerfile
      - .dockerignore
      - custom-server.js
      - chatgpt-web-viewer-proxy.cjs
      - next.config.mjs
      - jsconfig.json
      - postcss.config.mjs
      - scripts/copy-standalone-assets.mjs
      - scripts/build-chatgpt-session-export.mjs
      - scripts/docker-entrypoint.sh
      - .github/workflows/chatgpt-web-runtime.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      live_account:
        type: boolean
        default: false
        description: Run operator-provisioned real-account gate on protected disposable staging ARM64
      publish:
        type: boolean
        default: false
        description: Publish a native evidence-bearing ARM64 image after offline and security gates
      deploy:
        type: boolean
        default: false
        description: Deploy the scanned immutable runtime after operator bootstrap/enrollment
permissions:
  contents: read
# Reusable verification inherits the caller's event; isolate it explicitly from
# operator dispatches and superseding PR jobs so queued deploys cannot be cancelled.
concurrency:
  group: ${{ inputs.verification_only && format('cgw-runtime-verification-run-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && 'cgw-runtime-operations' || format('cgw-runtime-ci-run-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false
jobs:
  activation-fence:
    concurrency:
      group: ${{ format('cgw-runtime-activation-{0}', (inputs.verification_only || github.event_name == 'workflow_dispatch') && github.run_id || github.ref) }}
      cancel-in-progress: ${{ !inputs.verification_only && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce explicit default-branch activation
        env:
          LIVE_ACCOUNT: ${{ !inputs.verification_only && inputs.live_account || false }}
          PUBLISH: ${{ !inputs.verification_only && inputs.publish || false }}
          DEPLOY: ${{ !inputs.verification_only && inputs.deploy || false }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$LIVE_ACCOUNT" == true || "$PUBLISH" == true || "$DEPLOY" == true ]]; then
            [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo 'Live account, publication and deployment require the default branch' >&2; exit 1; }
          fi
          [[ "$DEPLOY" != true || "$PUBLISH" == true ]] || { echo 'Deploy requires this run to publish and scan its immutable image' >&2; exit 1; }

  gateway-contracts:
    concurrency:
      group: ${{ format('cgw-runtime-gateway-{0}', (inputs.verification_only || github.event_name == 'workflow_dispatch') && github.run_id || github.ref) }}
      cancel-in-progress: ${{ !inputs.verification_only && github.event_name != 'workflow_dispatch' }}
    needs: activation-fence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Isolate gateway contract state
        run: |
          set -euo pipefail
          state_home="$RUNNER_TEMP/cgw-gateway-contracts"
          mkdir -p "$state_home/data"
          printf 'HOME=%s\nUSERPROFILE=%s\nAPPDATA=%s\nDATA_DIR=%s/data\nCGW_DATA_DIR=%s/data\nENABLE_REQUEST_LOGS=false\nNEXT_TELEMETRY_DISABLED=1\n' "$state_home" "$state_home" "$state_home" "$state_home" "$state_home" >> "$GITHUB_ENV"
      - name: Verify release gate isolation and activation boundaries
        run: bun test tests/unit/chatgpt-web-deploy-gates.test.cjs
      - name: Install frozen gateway and test dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd tests
      # The regression umbrella below owns the other CGW contracts; routing is not discovered there.
      - name: Exercise model-test routing contract
        working-directory: tests
        run: |
          set -euo pipefail
          bun run test --config vitest.config.js unit/model-test-routing.test.js
      - name: Exercise task-modal setup and client boundaries
        working-directory: tests
        run: |
          set -euo pipefail
          bun run test --config vitest.config.js unit/chatgpt-web-client-config.test.js unit/chatgpt-web-extension-recovery.test.js unit/chatgpt-web-runtime-admin-client.test.js unit/chatgpt-web-runtime-admin.test.js unit/chatgpt-web-connection-state.test.js unit/chatgpt-web-credential-selection.test.js unit/chatgpt-web-executor-capabilities.test.js unit/chatgpt-web-terminal-failures.test.js unit/providers-chatgpt-web-crud.test.js integration/chatgpt-web.test.js translator/golden-response-stream.test.js
      - name: Exercise binary viewer authorization and transport on Node and Bun
        run: |
          set -euo pipefail
          node --test tests/unit/chatgpt-web-viewer-proxy.test.cjs
          bun test tests/unit/chatgpt-web-viewer-proxy.test.cjs
      - name: Exercise real disposable Bun SQLite profile migration
        run: bun tests/integration/chatgpt-web-profile-migration-smoke.mjs
      - name: Preserve current production regression contracts
        run: bash .deploy/verify.sh

  native:
    concurrency:
      group: ${{ format('cgw-runtime-native-{0}-{1}', (inputs.verification_only || github.event_name == 'workflow_dispatch') && github.run_id || github.ref, matrix.arch) }}
      cancel-in-progress: ${{ !inputs.verification_only && github.event_name != 'workflow_dispatch' }}
    needs: activation-fence
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      HTTP_PROXY: ''
      ARCH: ${{ matrix.arch }}
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      ENABLE_REQUEST_LOGS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Isolate offline state
        shell: bash
        run: |
          set -euo pipefail
          state_home="$RUNNER_TEMP/cgw-offline-home"
          mkdir -p "$state_home/data"
          printf 'HOME=%s\nUSERPROFILE=%s\nAPPDATA=%s\nDATA_DIR=%s/data\nCGW_DATA_DIR=%s/data\n' "$state_home" "$state_home" "$state_home" "$state_home" "$state_home" >> "$GITHUB_ENV"
      - name: Check frozen runtime types, behavior and entrypoint closure
        working-directory: services/chatgpt-web-runtime
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.0
          install -m 0755 "$(command -v bun)" "$RUNNER_TEMP/cgw-bun-1.4.0"
          bash ../../.deploy/verify-cgw-runtime.sh
          # Onboarding later needs Playwright in the checkout, not in the cold copy.
          bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load native image without emulation or push
        env:
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) echo 'Native runner mismatch' >&2; exit 1;; esac
          image="ghcr.io/thedemontuan/9router-cgw-runtime:${REVISION}-${ARCH}"
          docker buildx build --load --platform "linux/$ARCH" --build-arg "APP_REVISION=$REVISION" \
            -f services/chatgpt-web-runtime/Dockerfile -t "$image" .
          echo "CGW_CHECK_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Prove browserless image and installer boundaries inside Docker
        run: |
          set -euo pipefail
          volume="cgw-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          echo "CGW_BROWSER_VOLUME=$volume" >> "$GITHUB_ENV"
          docker volume create "$volume"
          docker run --rm --name "cgw-browserless-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" --read-only --network none --cpus 0.5 --memory 1g --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /run:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --env TMPDIR=/opt/cgw-browser --mount "type=volume,src=$volume,dst=/opt/cgw-browser" \
            "$CGW_CHECK_IMAGE" sh -c 'python3 -c '\''from pathlib import Path; import os; p = Path("/opt/cgw-browser"); assert not list(p.iterdir()); assert p.stat().st_uid == p.stat().st_gid == os.getuid() == 10001'\'' && python3 -B -m unittest discover -s tests -p install_browser_test.py && python3 -B -m unittest discover -s tests -p close_native_browser_test.py'
      - name: Provision pinned Chrome in an owned Docker cache volume
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          volume="$CGW_BROWSER_VOLUME"
          init="cgw-browser-init-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          echo "CGW_INIT_CONTAINER=$init" >> "$GITHUB_ENV"
          docker run --rm --name "$init" --user 10001:10001 --read-only --cpus 0.5 --memory 1g \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /run:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --mount "type=volume,src=$volume,dst=/opt/cgw-browser" \
            "$CGW_CHECK_IMAGE" python3 scripts/install-browser.py --manifest image-build-manifest.json
      # Only the producer emits native and generic compatibility after actual physical browser/MCP gates.
      - name: Prove sandbox, managed setup, native loop and generic batch handoff
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          hardening=(--rm --read-only --network none --cpus 1.0 --memory 2g --cap-drop ALL --security-opt no-new-privileges:true
            --security-opt "seccomp=$PWD/services/chatgpt-web-runtime/security/seccomp.json" --shm-size 1g
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777
            --tmpfs /run:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
            --tmpfs /data:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700
            --mount "type=volume,src=$CGW_BROWSER_VOLUME,dst=/opt/cgw-browser,readonly")
          echo "=== verify-harness-compatibility (includes native image sandbox proof) ==="
          docker run --name "cgw-compatibility-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" "${hardening[@]}" "$CGW_CHECK_IMAGE" bun scripts/verify-harness-compatibility.ts /data/compatibility.json
      - name: Prepare native offline lifecycle measurement prerequisites
        run: |
          set -euo pipefail
          test "$ARCH:$(uname -m)" = arm64:aarch64
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap xvfb openbox fonts-liberation fonts-noto-core fonts-noto-color-emoji \
            libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 \
            libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgbm1 libglib2.0-0t64 libgtk-3-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libudev1 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
          browser_cache="$RUNNER_TEMP/cgw-lifecycle-browser"
          mkdir -p "$browser_cache" "$RUNNER_TEMP/cgw-lifecycle-proof"
          docker run --rm --entrypoint tar --mount "type=volume,src=$CGW_BROWSER_VOLUME,dst=/opt/cgw-browser,readonly" \
            "$CGW_CHECK_IMAGE" -C /opt/cgw-browser -cf - . | tar -xf - -C "$browser_cache"
          browser="$browser_cache/155.0.8059.39/chrome"
          printf '3a1cc943acdb1d2a7ecb81c2c0736692eb9f3b14c81f0b1cbfa9f71b4828de1a  %s\n' "$browser" | sha256sum --check --strict
          printf 'CGW_LIFECYCLE_BROWSER=%s\n' "$browser" >> "$GITHUB_ENV"
          baseline="$RUNNER_TEMP/cgw-lifecycle-base"
          git worktree add -b "ci/cgw-lifecycle-base-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$baseline" 7aa1fdfe018c7433ce662f9f5ac0586e995c091f
          bun install --frozen-lockfile --cwd "$baseline/services/chatgpt-web-runtime"
          printf 'CGW_LIFECYCLE_BASE=%s\n' "$baseline" >> "$GITHUB_ENV"
      - name: Measure baseline and candidate lifecycle on native ARM64 only
        working-directory: services/chatgpt-web-runtime
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.0
          test "$(uname -m)" = aarch64
          export CGW_CHROMIUM_EXECUTABLE="$CGW_LIFECYCLE_BROWSER"
          bun scripts/benchmark-resource-lifecycle.ts --source-root "$CGW_LIFECYCLE_BASE" --profiles 3 --concurrency 1,3,5 --rounds 10 --idle-seconds 330 --samples 3 --output "$RUNNER_TEMP/cgw-lifecycle-proof/base.json"
          bun scripts/benchmark-resource-lifecycle.ts --source-root "$GITHUB_WORKSPACE" --profiles 3 --concurrency 1,3,5 --rounds 10 --idle-seconds 330 --samples 3 --output "$RUNNER_TEMP/cgw-lifecycle-proof/candidate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: cgw-lifecycle-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cgw-lifecycle-proof/*.json
          if-no-files-found: warn
      - name: Remove owned lifecycle baseline checkout
        if: ${{ always() && env.CGW_LIFECYCLE_BASE != '' }}
        run: |
          set -euo pipefail
          git worktree remove "$CGW_LIFECYCLE_BASE"
          git branch -d "ci/cgw-lifecycle-base-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install checksum-pinned native OpenCode for the disposable client gate
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in
            amd64:x86_64) asset=opencode-linux-x64.tar.gz; sha=c8f888b451f5494a18f858fffb0e0b68f4e4baa9c241761c5f206884f0fa640d ;;
            arm64:aarch64) asset=opencode-linux-arm64.tar.gz; sha=f7f2ba59ee8aa94d388f9696575a32d20e71c2ee48def9f80fc693a60fec6c72 ;;
            *) echo 'Native OpenCode runner mismatch' >&2; exit 1 ;;
          esac
          directory="$RUNNER_TEMP/cgw-opencode-1.18.35"
          mkdir -p "$directory"
          curl --fail --location --output "$directory/$asset" "https://github.com/anomalyco/opencode/releases/download/v1.18.35/$asset"
          printf '%s  %s\n' "$sha" "$directory/$asset" | sha256sum --check --strict
          tar -xzf "$directory/$asset" -C "$directory"
          test "$("$directory/opencode" --version)" = 1.18.35
          printf 'CGW_OPENCODE_BINARY=%s/opencode\n' "$directory" >> "$GITHUB_ENV"
      - name: Build isolated production gateway on the CI runner only
        id: gateway_build
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.2
          bun install --frozen-lockfile
          bun run build
          test -f .next/BUILD_ID
          test -f .next/standalone/custom-server.js
      - name: Exercise actual gateway, companion, four generic wires and OpenCode CLI
        id: gateway_e2e
        if: ${{ !cancelled() && steps.gateway_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          bun tests/integration/chatgpt-web-runtime-smoke.mjs --image "$CGW_CHECK_IMAGE" --browser-volume "$CGW_BROWSER_VOLUME" --gateway-port 21127 --opencode "$CGW_OPENCODE_BINARY" --proof-dir "$RUNNER_TEMP/cgw-gateway-proof"
      - name: Prepare sandboxed Chrome session onboarding prerequisites
        id: onboarding_setup
        if: ${{ !cancelled() && steps.gateway_build.outcome == 'success' }}
        # Each smoke below owns a separate outcome; a failed gateway/tool gate
        # must not prevent the production and standalone consent checks.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool
          export CGW_GATEWAY_BUN="$(command -v bun)"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/cgw-export-browser"
          "$RUNNER_TEMP/cgw-bun-1.4.0" services/chatgpt-web-runtime/node_modules/playwright-core/cli.js install chromium
          # Ubuntu restricts user namespaces for downloaded Chrome. Allow only this
          # job's executable, keeping Chromium sandbox and global policy enabled.
          chrome=("$PLAYWRIGHT_BROWSERS_PATH"/chromium-*/chrome-linux*/chrome)
          test "${#chrome[@]}" = 1 && test -x "${chrome[0]}"
          sandbox_profile="$RUNNER_TEMP/cgw-export.apparmor"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile cgw-export-%s-%s "%s" flags=(unconfined) {\n  userns,\n}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${chrome[0]}" > "$sandbox_profile"
          sudo apparmor_parser -a "$sandbox_profile"
          printf 'CGW_GATEWAY_BUN=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\nCGW_EXPORT_SANDBOX_PROFILE=%s\n' \
            "$CGW_GATEWAY_BUN" "$PLAYWRIGHT_BROWSERS_PATH" "$sandbox_profile" >> "$GITHUB_ENV"
      - name: Exercise actual Chrome session export
        id: session_export
        if: ${{ !cancelled() && steps.onboarding_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cgw-bun-1.4.0" services/chatgpt-web-runtime/scripts/session-export-smoke.ts \
            --extension-dir "$PWD/public/downloads/chatgpt-web-session-export" --output "$RUNNER_TEMP/cgw-synthetic-session.json"
      - name: Exercise production dashboard and extension consent races
        id: session_production
        if: ${{ !cancelled() && steps.onboarding_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          xvfb-run -a "$RUNNER_TEMP/cgw-bun-1.4.0" services/chatgpt-web-runtime/scripts/session-connect-smoke.ts \
            --worktree "$PWD" --proof-dir "$RUNNER_TEMP/cgw-session-connect-proof"
      - name: Exercise standalone dashboard and extension consent races
        id: session_standalone
        if: ${{ !cancelled() && steps.onboarding_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          xvfb-run -a "$RUNNER_TEMP/cgw-bun-1.4.0" services/chatgpt-web-runtime/scripts/session-connect-smoke.ts \
            --worktree "$PWD" --gateway-entry "$PWD/.next/standalone/custom-server.js" \
            --proof-dir "$RUNNER_TEMP/cgw-session-connect-standalone-proof"
      - name: Exercise native image login and session transfer onboarding
        id: onboarding
        if: ${{ !cancelled() && steps.session_export.outcome == 'success' }}
        run: |
          set -euo pipefail
          gateway="cgw-onboarding-gateway:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker build -f Dockerfile -t "$gateway" .
          bun tests/integration/chatgpt-web-onboarding-smoke.mjs --gateway-image "$gateway" \
            --runtime-image "$CGW_CHECK_IMAGE" --browser-volume "$CGW_BROWSER_VOLUME" \
            --proof-dir "$RUNNER_TEMP/cgw-onboarding-proof" --session-file "$RUNNER_TEMP/cgw-synthetic-session.json"
      - name: Preserve synthetic provider onboarding visual proof
        if: ${{ !cancelled() && (steps.onboarding.outcome == 'success' || steps.onboarding.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cgw-provider-onboarding-${{ matrix.arch }}
          path: ${{ runner.temp }}/cgw-onboarding-proof
          if-no-files-found: error
          retention-days: 7
      - name: Preserve synthetic direct connection proof
        if: ${{ !cancelled() && (steps.session_production.outcome == 'success' || steps.session_production.outcome == 'failure' || steps.session_standalone.outcome == 'success' || steps.session_standalone.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cgw-session-connect-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/cgw-session-connect-proof
            ${{ runner.temp }}/cgw-session-connect-standalone-proof
          if-no-files-found: error
          retention-days: 7
      - name: Preserve safe gateway and OpenCode acceptance evidence
        if: ${{ !cancelled() && (steps.gateway_e2e.outcome == 'success' || steps.gateway_e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cgw-gateway-opencode-${{ matrix.arch }}
          path: ${{ runner.temp }}/cgw-gateway-proof
          if-no-files-found: error
          retention-days: 7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TheDemonTuan/vps-deploy
          ref: 3a31f12ce0c9e2aec4590f5c397692e60b595491
          path: platform
          persist-credentials: false
      - name: Scan browserless runtime and Docker browser metadata without suppression
        run: |
          set -euo pipefail
          sudo bash platform/scripts/install-trivy.sh /usr/local/bin
          trivy image --scanners vuln --ignorefile /dev/null --severity HIGH,CRITICAL --exit-code 1 "$CGW_CHECK_IMAGE"
          sudo bash platform/scripts/install-grype.sh /usr/local/bin
          docker run --rm --name "cgw-browser-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" --read-only --network none --cpus 0.5 --memory 1g --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /run:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --mount "type=volume,src=$CGW_BROWSER_VOLUME,dst=/opt/cgw-browser,readonly" \
            "$CGW_CHECK_IMAGE" bun -e 'const manifest = await Bun.file("image-build-manifest.json").json(); process.stdout.write(await Bun.file(manifest.browser.installRoot + "/browser.spdx.json").text())' > "$RUNNER_TEMP/browser.spdx.json"
          python3 platform/scripts/scan-browser.py --sbom "$RUNNER_TEMP/browser.spdx.json" \
            --report "$RUNNER_TEMP/grype-browser.json"
      - name: Clean only this native job's owned Docker resources
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker rm -f "cgw-browser-init-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" \
            "cgw-browserless-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" \
            "cgw-browser-metadata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" \
            "cgw-compatibility-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}" 2>/dev/null || true
          if [[ -n "${CGW_BROWSER_VOLUME:-}" ]]; then docker volume rm "$CGW_BROWSER_VOLUME"; fi
          if [[ -n "${CGW_EXPORT_SANDBOX_PROFILE:-}" && -f "$CGW_EXPORT_SANDBOX_PROFILE" ]]; then
            sudo apparmor_parser -R "$CGW_EXPORT_SANDBOX_PROFILE"
            rm -f "$CGW_EXPORT_SANDBOX_PROFILE"
          fi
          rm -f "$RUNNER_TEMP/cgw-synthetic-session.json" "$RUNNER_TEMP/cgw-bun-1.4.0"
          rm -rf "$RUNNER_TEMP/cgw-export-browser"
      # No registry login, push, account-state artifact upload, reusable old platform
      # Trivy call, deploy action, or production manifest/pin mutation belongs here.

  live-staging:
    needs: [native, gateway-contracts]
    if: github.event_name == 'workflow_dispatch' && !inputs.verification_only && inputs.live_account && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, ARM64, cgw-staging-disposable]
    environment: staging
    timeout-minutes: 60
    env:
      CGW_LIVE: '1'
      CGW_STAGING_CONFIG_FILE: ${{ vars.CGW_STAGING_CONFIG_FILE }}
      CGW_STAGING_PROFILE: ${{ vars.CGW_STAGING_PROFILE }}
      ENABLE_REQUEST_LOGS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Require operator-owned private staging prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(bun --version)" = 1.4.0
          test -n "$CGW_STAGING_PROFILE"
          test -n "$CGW_STAGING_CONFIG_FILE"
          test -f "$CGW_STAGING_CONFIG_FILE"
          test -r "$CGW_STAGING_CONFIG_FILE"
          # Secret files/login/connector/Codex workspace are provisioned out of band
          # on this disposable runner; never materialize them from PR input or artifacts.
      - name: Exercise real account and local Codex harness
        working-directory: services/chatgpt-web-runtime
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run smoke:live -- --profile "$CGW_STAGING_PROFILE"
      # No account screenshots, browser/rollout state, keys, or private config uploads.

  security-source:
    name: Trivy CGW source gate
    needs: [activation-fence]
    if: github.event_name == 'workflow_dispatch' && !inputs.verification_only && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: read
    uses: TheDemonTuan/vps-deploy/.github/workflows/security-trivy.yml@3a31f12ce0c9e2aec4590f5c397692e60b595491
    with:
      app: 9router
      source-sha: ${{ github.sha }}
      platform-ref: 3a31f12ce0c9e2aec4590f5c397692e60b595491
      config: .deploy/app.yml
      scan-mode: source

  publish:
    name: Publish verified native CGW image
    needs: [security-source, native, gateway-contracts, live-staging]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.verification_only && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.security-source.result == 'success' && needs.native.result == 'success' && needs.gateway-contracts.result == 'success' && (!inputs.live_account || needs.live-staging.result == 'success') }}
    permissions:
      contents: read
      packages: write
    uses: TheDemonTuan/vps-deploy/.github/workflows/build-docker.yml@f9ba4e8f3235190cee08a3f0cff3ca59fa46bdd2
    with:
      app: 9router
      component: cgw
      source-sha: ${{ github.sha }}
      platform-ref: f9ba4e8f3235190cee08a3f0cff3ca59fa46bdd2
      config: .deploy/app.yml

  security-image:
    name: Trivy immutable CGW image gate
    needs: publish
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.verification_only && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.publish.result == 'success' }}
    permissions:
      contents: read
      packages: read
    uses: TheDemonTuan/vps-deploy/.github/workflows/security-trivy.yml@3a31f12ce0c9e2aec4590f5c397692e60b595491
    with:
      app: 9router
      source-sha: ${{ github.sha }}
      platform-ref: 3a31f12ce0c9e2aec4590f5c397692e60b595491
      config: .deploy/app.yml
      scan-mode: image
      image-ref: ${{ needs.publish.outputs.image-ref }}
      platform: linux/arm64

  deploy-runtime:
    name: Deploy scanned immutable CGW runtime
    concurrency:
      group: 9router-oracle-main-production
      queue: max
      cancel-in-progress: false
    needs: [publish, security-image]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.verification_only && inputs.publish && inputs.deploy && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.publish.result == 'success' && needs.security-image.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 34
    steps:
      - uses: TheDemonTuan/vps-deploy/.github/actions/deploy@3a31f12ce0c9e2aec4590f5c397692e60b595491
        with:
          app: 9router
          host: oracle-main
          operation: deploy
          component: cgw
          source-sha: ${{ github.sha }}
          platform-ref: 3a31f12ce0c9e2aec4590f5c397692e60b595491
          config: .deploy/app.yml
          image-ref: ${{ needs.publish.outputs.image-ref }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
