name: RTK sidecar
on:
  pull_request:
    paths:
      - sidecars/rtk/**
      - open-sse/config/rtkConfig.js
      - open-sse/rtk/**
      - open-sse/handlers/chatCore.js
      - tests/unit/rtk*.test.js
      - tests/integration/rtk-sidecar-smoke.mjs
      - open-sse/token-saver/**
      - open-sse/config/tokenSaverConfig.js
      - tests/unit/session-dedup*.test.js
      - tests/unit/token-saver*.test.js
      - tests/unit/dashboard-guard.test.js
      - tests/integration/token-saver-runtime-smoke.mjs
      - tests/integration/token-saver-settings-smoke.mjs
      - src/app/(dashboard)/dashboard/token-saver/**
      - src/app/api/rtk/status/**
      - src/app/api/token-saver/status/**
      - .deploy/app.yml
      - .github/workflows/rtk-sidecar.yml
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish immutable multiarchitecture image (default branch only)
      deploy:
        type: boolean
        default: false
        description: Deploy published digest to VPS after both architecture gates pass
permissions:
  contents: read
concurrency:
  group: rtk-sidecar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENABLE_REQUEST_LOGS: 'false'
      ENABLE_TRANSLATOR: 'false'
      RTK_URL: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Isolate verification state
        shell: bash
        run: |
          state_home="$RUNNER_TEMP/token-saver-home"
          mkdir -p "$state_home/data"
          printf 'HOME=%s\nUSERPROFILE=%s\nAPPDATA=%s\nDATA_DIR=%s/data\n' "$state_home" "$state_home" "$state_home" "$state_home" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd tests
      - name: Run focused RTK regressions
        working-directory: tests
        run: bun run test --config vitest.config.js unit/rtk-hybrid.test.js unit/rtk-dashboard.test.js unit/rtk.test.js unit/rtkKiro.test.js unit/rtk-cursor-pretranslate.test.js unit/rtk-production.test.js unit/rtk-test-output.test.js
      - name: Run focused dedup policy and auth regressions
        working-directory: tests
        run: bun run test --config vitest.config.js unit/session-dedup.test.js unit/session-dedup-pipeline.test.js unit/token-saver-state.test.js unit/token-saver-fence.test.js unit/token-saver-shadow.test.js unit/token-saver-policy.test.js unit/dashboard-guard.test.js
      - name: Preserve request regressions
        working-directory: tests
        run: bun x vitest run --config vitest.config.js unit/force-stream-config.test.js unit/minimax-transport-target-format.test.js
      - name: Exercise provider-bound token savers
        run: bun tests/integration/token-saver-runtime-smoke.mjs
      - name: Exercise settings persistence
        run: bun tests/integration/token-saver-settings-smoke.mjs
      - name: Build gateway
        run: bun run build

  native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install gateway dependencies for HTTP smoke
        run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and exercise native image
        run: |
          set -euo pipefail
          version="$(bun -p "JSON.parse(require('fs').readFileSync('sidecars/rtk/upstream.json')).version")"
          revision="$(bun -p "JSON.parse(require('fs').readFileSync('sidecars/rtk/upstream.json')).revision")"
          docker buildx build --load --platform linux/${{ matrix.arch }} -f sidecars/rtk/Dockerfile -t "rtk-check:${version}-r${revision}" .
          bun tests/integration/rtk-sidecar-smoke.mjs --image "rtk-check:${version}-r${revision}"
      - name: Publish native digest after smoke
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/rtk-sidecar"
          version="$(bun -p "JSON.parse(require('fs').readFileSync('sidecars/rtk/upstream.json')).version")"
          revision="$(bun -p "JSON.parse(require('fs').readFileSync('sidecars/rtk/upstream.json')).revision")"
          tag="${version}-r${revision}"
          echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if docker manifest inspect "${image}:${tag}" >/dev/null 2>&1; then echo 'Tag exists; increase manifest revision' >&2; exit 1; fi
          if docker manifest inspect "${image}:${tag}-${{ matrix.arch }}" >/dev/null 2>&1; then echo 'Architecture tag exists; increase manifest revision' >&2; exit 1; fi
          docker tag "rtk-check:${tag}" "${image}:${tag}-${{ matrix.arch }}"
          docker push "${image}:${tag}-${{ matrix.arch }}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}:${tag}-${{ matrix.arch }}")"
          echo "${digest}" > "rtk-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
        with:
          name: rtk-${{ matrix.arch }}
          path: rtk-${{ matrix.arch }}.txt
  manifest:
    needs: native
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rtk-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Create immutable multiarchitecture manifest
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/rtk-sidecar"
          version="$(bun -p "JSON.parse(require('fs').readFileSync('sidecars/rtk/upstream.json')).version")"
          revision="$(bun -p "JSON.parse(require('fs').readFileSync('sidecars/rtk/upstream.json')).revision")"
          tag="${version}-r${revision}"
          echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if docker manifest inspect "${image}:${tag}" >/dev/null 2>&1; then echo 'Tag exists; increase manifest revision' >&2; exit 1; fi
          docker buildx imagetools create -t "${image}:${tag}" "$(cat rtk-amd64.txt)" "$(cat rtk-arm64.txt)"
          digest="$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}')"
          echo "RTK_IMAGE=${image}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          echo "image_ref=${image}@${digest}" >> "$GITHUB_OUTPUT"

  security-image-arm64:
    name: Trivy RTK ARM64 image gate
    needs: manifest
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: read
    uses: TheDemonTuan/vps-deploy/.github/workflows/security-trivy.yml@09841520ba30445a6df6861d8f4e8b9da2349adb
    with:
      app: 9router
      source-sha: ${{ github.sha }}
      platform-ref: 09841520ba30445a6df6861d8f4e8b9da2349adb
      config: .deploy/app.yml
      scan-mode: image
      image-ref: ${{ needs.manifest.outputs.image_ref }}
      platform: linux/arm64

  deploy:
    needs:
      - manifest
      - security-image-arm64
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.deploy && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 17
    steps:
      - uses: TheDemonTuan/vps-deploy/.github/actions/deploy@09841520ba30445a6df6861d8f4e8b9da2349adb
        with:
          app: 9router
          host: oracle-main
          operation: deploy
          component: rtk
          source-sha: ${{ github.sha }}
          platform-ref: 09841520ba30445a6df6861d8f4e8b9da2349adb
          config: .deploy/app.yml
          image-ref: ${{ needs.manifest.outputs.image_ref }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
