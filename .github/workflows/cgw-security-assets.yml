name: CGW native patched security assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TheDemonTuan/vps-deploy
          ref: f6d40a519c2bf8b0a19e3f9c714b737875052870
          path: platform
          persist-credentials: false
      - name: Build actual native OS and patched tunnel closure
        env:
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) exit 1;; esac
          package=services/chatgpt-web-runtime
          context="$RUNNER_TEMP/cgw-security-assets"
          mkdir -p "$context"
          cp "$package/image-build-manifest.json" "$context/"
          cp "$package/scripts/install-ubuntu-snapshot.sh" "$package/scripts/install-image-assets.py" "$package/scripts/build-tunnel-assets.py" "$context/"
          cp -r "$package/scripts/tunnel-build-lock" "$context/"
          cat > "$context/Dockerfile" <<'DOCKER'
          FROM ubuntu:24.04@sha256:a853f94d226358a79c740cfc7bce0c289748f3fe3488d921d038ccd752c61b60
          ARG TARGETARCH
          ARG APP_REVISION
          COPY install-ubuntu-snapshot.sh /build/install-ubuntu-snapshot.sh
          ADD --checksum=sha256:6bac2a01979e210d9eac1d4d56747ec709ea60654744d66705dc3c36e7629e50 https://snapshot.ubuntu.com/ubuntu/20261003T000000Z/pool/main/c/ca-certificates/ca-certificates_20260601~24.04.1_all.deb /build/ca-certificates.deb
          RUN sh /build/install-ubuntu-snapshot.sh --ca-bootstrap /build/ca-certificates.deb --arch "$TARGETARCH" python3 tini xvfb openbox x11vnc xauth fonts-liberation fonts-noto-core fonts-noto-color-emoji libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgbm1 libgcc-s1 libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 libstdc++6 libudev1 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 && rm /build/ca-certificates.deb
          WORKDIR /build
          COPY image-build-manifest.json install-image-assets.py build-tunnel-assets.py ./
          COPY tunnel-build-lock/ ./tunnel-build-lock/
          ENV GOMAXPROCS=2
          RUN python3 install-image-assets.py --manifest image-build-manifest.json --arch "$TARGETARCH" --revision "$APP_REVISION" --output /usr/local
          DOCKER
          docker build --build-arg "TARGETARCH=$ARCH" --build-arg "APP_REVISION=$REVISION" -t cgw-security-assets:check "$context"
      - name: Exercise rootless offline tunnel initialization
        run: |
          set -euo pipefail
          docker run --rm --user 10001:10001 --read-only --network none --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,nosuid,nodev,mode=1777 cgw-security-assets:check sh -c '
            bun --version && tunnel-client --version && cloudflared --version &&
            printf synthetic-offline-key > /tmp/fixture-key &&
            tunnel-client init --sample sample_mcp_stdio_local --profile-dir /tmp/fixture-profile --profile fixture --tunnel-id tunnel_00000000000000000000000000000000 --control-plane-api-key-ref file:/tmp/fixture-key --mcp-command /usr/bin/true --health-listen-addr 127.0.0.1:19000'
      - name: Scan actual binaries and full SPDX without suppression
        run: |
          set -euo pipefail
          sudo bash platform/scripts/install-trivy.sh /usr/local/bin
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 cgw-security-assets:check
