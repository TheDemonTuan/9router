name: ChatGPT Web Linux Transport

on:
  pull_request:
  workflow_dispatch:
    inputs:
      headroom_sidecar:
        description: "Run Headroom 0.38.0 sidecar acceptance probe on this disposable runner"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chatgpt-web-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix-socket:
    name: Unix-socket bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install runtime dependencies
        run: bun install --frozen-lockfile

      - name: Install test dependencies
        working-directory: tests
        run: bun install --frozen-lockfile

      - name: Run Unix-socket bridge transport tests
        working-directory: tests
        run: |
          set -euo pipefail
          bun x vitest run --config vitest.config.js \
            integration/chatgpt-web.test.js \
            unit/chatgpt-web-concurrency.test.js \
            unit/chatgpt-web-connection-test.test.js \
            unit/chatgpt-web-executor-capabilities.test.js \
            unit/provider-validation-chatgpt-web.test.js \
            --reporter=verbose

  headroom-unit:
    name: Headroom unit & resilience tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install runtime dependencies
        run: bun install --frozen-lockfile

      - name: Install test dependencies
        working-directory: tests
        run: bun install --frozen-lockfile

      - name: Run Headroom focused unit suites
        working-directory: tests
        run: |
          set -euo pipefail
          bun x vitest run --config vitest.config.js \
            unit/headroom.test.js \
            unit/headroom-responses-format.test.js \
            unit/headroom-detect.test.js \
            unit/headroom-chat-core.test.js \
            unit/headroom-stage-invariants.test.js \
            unit/claude-header-forwarding.test.js \
            unit/headroom-resilience.test.js \
            --reporter=verbose

      - name: Run isolated offline resilience smoke
        run: bun tests/integration/headroom-resilience-smoke.mjs --offline

  headroom-sidecar:
    if: github.event_name == 'workflow_dispatch' && inputs.headroom_sidecar
    name: Headroom 0.38.0 sidecar acceptance probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Pull pinned sidecar
        run: docker pull ghcr.io/headroomlabs-ai/headroom:0.38.0@sha256:14e3dda1f041eef509af850ac7a32647d1c3e5d9bd66e3e8655dfd3a398273af
      - name: Probe local-only synthetic traffic
        run: bun tests/integration/headroom-resilience-smoke.mjs --sidecar --probe --output "$RUNNER_TEMP/headroom-probe.json"
      - name: Upload probe measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headroom-probe
          path: ${{ runner.temp }}/headroom-probe.json
          if-no-files-found: ignore
