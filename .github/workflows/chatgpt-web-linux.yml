name: ChatGPT Web Linux Transport

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-web-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix-socket:
    name: Unix-socket bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install runtime dependencies
        run: bun install --frozen-lockfile

      - name: Install test dependencies
        working-directory: tests
        run: bun install --frozen-lockfile

      - name: Run Unix-socket bridge transport tests
        working-directory: tests
        run: |
          set -euo pipefail
          bun x vitest run --config vitest.config.js \
            integration/chatgpt-web.test.js \
            unit/chatgpt-web-concurrency.test.js \
            unit/chatgpt-web-connection-test.test.js \
            unit/chatgpt-web-executor-capabilities.test.js \
            unit/provider-validation-chatgpt-web.test.js \
            --reporter=verbose
