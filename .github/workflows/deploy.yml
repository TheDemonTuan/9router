name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build image only without deploying to VPS"
        type: boolean
        default: false

concurrency:
  group: 9router-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activation-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require default-branch build and deployment
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo 'Build and Deploy requires the default branch (including skip_deploy=true)' >&2; exit 1; }

  verify:
    name: Application regression gates
    needs: activation-fence
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install runtime dependencies
        run: bun install --frozen-lockfile
      - name: Install test dependencies
        working-directory: tests
        run: bun install --frozen-lockfile
      - name: Run application regression gates
        env:
          HOME: ${{ runner.temp }}/9router-home
          DATA_DIR: ${{ runner.temp }}/9router-home/data
        run: bash .deploy/verify.sh

  runtime-gates:
    name: ChatGPT Web offline release gates
    needs: activation-fence
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/chatgpt-web-runtime.yml
    with:
      verification_only: true

  security-source:
    name: Trivy source security gate
    needs: activation-fence
    permissions:
      contents: read
      packages: read
    uses: TheDemonTuan/vps-deploy/.github/workflows/security-trivy.yml@3a31f12ce0c9e2aec4590f5c397692e60b595491
    with:
      app: 9router
      source-sha: ${{ github.sha }}
      platform-ref: 3a31f12ce0c9e2aec4590f5c397692e60b595491
      config: .deploy/app.yml
      scan-mode: source

  build:
    name: Build and smoke immutable image
    needs:
      - verify
      - security-source
      - runtime-gates
    permissions:
      contents: read
      packages: write
    uses: TheDemonTuan/vps-deploy/.github/workflows/build-docker.yml@f9ba4e8f3235190cee08a3f0cff3ca59fa46bdd2
    with:
      app: 9router
      source-sha: ${{ github.sha }}
      platform-ref: f9ba4e8f3235190cee08a3f0cff3ca59fa46bdd2
      config: .deploy/app.yml

  security-image:
    name: Trivy immutable image gate
    needs: build
    permissions:
      contents: read
      packages: read
    uses: TheDemonTuan/vps-deploy/.github/workflows/security-trivy.yml@3a31f12ce0c9e2aec4590f5c397692e60b595491
    with:
      app: 9router
      source-sha: ${{ github.sha }}
      platform-ref: 3a31f12ce0c9e2aec4590f5c397692e60b595491
      config: .deploy/app.yml
      scan-mode: image
      image-ref: ${{ needs.build.outputs.image-ref }}
      platform: linux/arm64
  deploy:
    concurrency:
      group: 9router-oracle-main-production
      queue: max
      cancel-in-progress: false
    name: Deploy immutable digest
    needs:
      - build
      - security-image
    if: github.event_name == 'push' || !inputs.skip_deploy
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 17
    steps:
      - uses: TheDemonTuan/vps-deploy/.github/actions/deploy@3a31f12ce0c9e2aec4590f5c397692e60b595491
        with:
          app: 9router
          host: oracle-main
          operation: deploy
          component: app
          source-sha: ${{ github.sha }}
          platform-ref: 3a31f12ce0c9e2aec4590f5c397692e60b595491
          config: .deploy/app.yml
          image-ref: ${{ needs.build.outputs.image-ref }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
