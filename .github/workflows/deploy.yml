name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build image only without deploying to VPS"
        type: boolean
        default: false

concurrency:
  group: 9router-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Application regression gates
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install runtime dependencies
        run: bun install --frozen-lockfile
      - name: Install test dependencies
        working-directory: tests
        run: bun install --frozen-lockfile
      - name: Run application regression gates
        env:
          HOME: ${{ runner.temp }}/9router-home
          DATA_DIR: ${{ runner.temp }}/9router-home/data
        run: bash .deploy/verify.sh

  build:
    name: Build and smoke immutable image
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: TheDemonTuan/vps-deploy/.github/workflows/build-docker.yml@eae631bc7d812033042f5de431f5adbe4995f526
    with:
      source-sha: ${{ github.sha }}
      platform-ref: eae631bc7d812033042f5de431f5adbe4995f526
      config: .deploy/app.yml

  deploy:
    name: Deploy immutable digest
    needs: build
    if: github.event_name == 'push' || !inputs.skip_deploy
    # Use the same 40-hex release SHA as the build caller and the installed host profile.
    uses: TheDemonTuan/vps-deploy/.github/workflows/deploy-vps.yml@eae631bc7d812033042f5de431f5adbe4995f526
    with:
      app: 9router
      component: app
      source-sha: ${{ github.sha }}
      platform-ref: eae631bc7d812033042f5de431f5adbe4995f526
      config: .deploy/app.yml
      image-ref: ${{ needs.build.outputs.image-ref }}
