name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build image only without deploying to VPS"
        type: boolean
        default: false

concurrency:
  group: 9router-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Responses & Translator Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install runtime dependencies
        run: bun install --frozen-lockfile
      - name: Install test dependencies
        working-directory: tests
        run: bun install --frozen-lockfile
      - name: Run offline translator verification
        working-directory: tests
        run: |
          set -euo pipefail
          response_tests="$(find unit translator -type f -name '*responses*.test.js' ! -path '*/real/*' | sort)"
          chatgpt_web_tests="$(find unit integration -type f -name '*chatgpt*.test.js' ! -path '*/real/*' | sort)"
          printf 'Responses regression gate:\n%s\n' "$response_tests"
          printf 'ChatGPT Web regression gate:\n%s\n' "$chatgpt_web_tests"
          bun x vitest run --config vitest.config.js \
            $response_tests \
            $chatgpt_web_tests \
            unit/codex-tool-normalization.test.js \
            unit/codex-native-passthrough-thinking.test.js \
            unit/base-executor-timeout-classification.test.js \
            integration/zcode-concurrent-responses.test.js \
            unit/grok-build-config.test.js \
            unit/quota-classification.test.js \
            unit/quota-response-contract.test.js \
            unit/chat-quota-handler.test.js \
            unit/antigravity-quota-routing.test.js \
            unit/continuity-strip.test.js \
            unit/alibaba-token-plan-thinking.test.js \
            unit/alibaba-token-plan-catalog.test.js \
            unit/alibaba-token-plan-capabilities.test.js \
            unit/alibaba-token-plan-models-route.test.js \
            unit/alibaba-token-plan-provider.test.js \
            translator/alibaba-token-plan-pipeline.test.js
      - name: Run h2c and Bun disconnect regressions
        run: |
          set -euo pipefail
          node --test tests/unit/custom-server-h2c.test.cjs tests/unit/custom-server-h2c-concurrent.test.cjs
          bun test tests/unit/bun-client-disconnect.test.cjs
      - name: Verify provider, alias, and OAuth baselines
        working-directory: tests
        run: |
          node __baseline__/verify-providers.mjs
          node __baseline__/verify-alias.mjs
          node __baseline__/verify-oauth-urls.mjs
      - name: Verify translator regression baseline
        working-directory: tests
        run: |
          set +e
          bun x vitest run --config vitest.config.js translator/alibaba-token-plan-pipeline.test.js --reporter=json --outputFile=translator-results.json
          vitest_status=$?
          set -e
          node __baseline__/verify-no-regression.mjs translator-results.json
          if [ "$vitest_status" -ne 0 ]; then
            echo "Known baseline failures verified; no new translator regression."
          fi

  build:
    name: Build & Push Native Image
    timeout-minutes: 10
    needs: test
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lc}/9router"
          tag="sha-${{ github.sha }}"
          echo "image_ref=${image}:${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          provenance: false
          sbom: false

      - name: Inspect image size and layers
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          docker buildx imagetools inspect \
            --raw "$IMAGE_REF" > /tmp/image-manifest.json

          if jq -e '.manifests' /tmp/image-manifest.json >/dev/null 2>&1; then
            platform_digest="$(jq -r '.manifests[0].digest' /tmp/image-manifest.json)"
            image_base="${IMAGE_REF%%:*}"
            docker buildx imagetools inspect \
              --raw "${image_base}@${platform_digest}" > /tmp/image-manifest.json
          fi

          echo "=== Image Summary ==="
          jq '
            [.layers[].size] |
            {
              layers: length,
              compressed_bytes: add,
              compressed_mib: (((add / 1024 / 1024) * 100 | floor) / 100)
            }
          ' /tmp/image-manifest.json

          echo "=== Layer Breakdown ==="
          jq -r '
            .layers[] |
            "\(.digest)  \(((.size / 1024 / 1024) * 100 | floor) / 100) MiB"
          ' /tmp/image-manifest.json

      - name: Runtime smoke test image
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          set -euo pipefail
          echo "Pulling freshly built image for runtime smoke test..."
          docker pull "$IMAGE_REF"

          cid="$(docker run -d \
            -e DATA_DIR=/tmp/9router-smoke \
            "$IMAGE_REF")"

          echo "Container ID: $cid"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          echo "Waiting for health check (max 30s)..."
          healthy=false
          for i in $(seq 1 30); do
            if docker exec "$cid" wget -qO- http://127.0.0.1:20128/api/health 2>/dev/null | grep -q '"ok":true'; then
              healthy=true
              echo "Health check passed in ${i}s."
              break
            fi
            sleep 1
          done

          if [ "$healthy" != "true" ]; then
            echo "Health check failed!"
            docker logs "$cid"
            exit 1
          fi

          echo "Waiting 12s for initial background token refresh tick..."
          sleep 12

          logs="$(docker logs "$cid" 2>&1)"
          printf '%s\n' "$logs"

          if printf '%s\n' "$logs" | grep -E "Cannot find package|ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND|BG_TOKEN_REFRESH.*Tick failed"; then
            echo "Runtime smoke test failed: detected missing package or background refresh tick failure!"
            exit 1
          fi

          echo "Runtime smoke test passed cleanly."

  deploy:
    name: Deploy to VPS (Blue/Green)
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'push' || !inputs.skip_deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi

      - name: Sync compose and deploy scripts to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/9router' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes \
            docker-compose.prod.yml docker-compose.chatgpt-web.yml deploy.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Execute Blue/Green Cutover on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/9router' }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" "
              set -euo pipefail
              chmod +x '$DEPLOY_PATH/deploy.sh'
              printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
              cd '$DEPLOY_PATH'
              ./deploy.sh '$IMAGE_REF'
              ./deploy.sh --status
            "
