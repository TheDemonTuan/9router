name: VPS deployment operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Status, rollback to retained previous slot, or explicit recovery
        required: true
        type: choice
        options: [status, rollback, reconcile]
      component:
        description: Component (rollback supports app only)
        required: true
        type: choice
        options: [app, rtk]

permissions:
  contents: read

jobs:
  operate:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (inputs.operation != 'rollback' || inputs.component == 'app')
    uses: TheDemonTuan/vps-deploy/.github/workflows/operate-vps.yml@ac959756491edc31c5970bba19b891547faa64fe
    with:
      operation: ${{ inputs.operation }}
      app: 9router
      component: ${{ inputs.component }}
      source-sha: ${{ github.sha }}
      platform-ref: ac959756491edc31c5970bba19b891547faa64fe
      config: .deploy/app.yml
