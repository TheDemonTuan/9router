name: VPS deployment operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Status, rollback to retained previous slot, or explicit recovery
        required: true
        type: choice
        options: [status, rollback, reconcile]
      component:
        description: Component (rollback supports app only)
        required: true
        type: choice
        options: [app, rtk, cgw]

permissions:
  contents: read

jobs:
  operate:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (inputs.operation != 'rollback' || inputs.component == 'app')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: ${{ inputs.component == 'cgw' && 34 || 17 }}
    steps:
      - uses: TheDemonTuan/vps-deploy/.github/actions/deploy@1f33d412b386989a35cc4fa664be8d9b3fa7b8a0
        with:
          app: 9router
          host: oracle-main
          operation: ${{ inputs.operation }}
          component: ${{ inputs.component }}
          source-sha: ${{ github.sha }}
          platform-ref: 1f33d412b386989a35cc4fa664be8d9b3fa7b8a0
          config: .deploy/app.yml
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
