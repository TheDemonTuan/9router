name: VPS deployment operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Status, rollback to retained previous slot, or explicit recovery
        required: true
        type: choice
        options: [status, rollback, reconcile]
      component:
        description: Component (rollback supports app only)
        required: true
        type: choice
        options: [app, rtk]

permissions:
  contents: read

jobs:
  credential-probe:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Verify environment credential exists
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: test -n "$DEPLOY_SSH_KEY"

  operate:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (inputs.operation != 'rollback' || inputs.component == 'app')
    uses: TheDemonTuan/vps-deploy/.github/workflows/operate-vps.yml@594772563df2b16088c93c111bf86d43d115cf6f
    with:
      operation: ${{ inputs.operation }}
      app: 9router
      component: ${{ inputs.component }}
      source-sha: ${{ github.sha }}
      platform-ref: 594772563df2b16088c93c111bf86d43d115cf6f
      config: .deploy/app.yml
