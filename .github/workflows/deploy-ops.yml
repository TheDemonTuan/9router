name: VPS deployment operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Status, rollback to retained previous slot, or explicit recovery
        required: true
        type: choice
        options: [status, rollback, reconcile]
      component:
        description: Component (rollback supports app only)
        required: true
        type: choice
        options: [app, rtk]

permissions:
  contents: read

jobs:
  operate:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (inputs.operation != 'rollback' || inputs.component == 'app')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 17
    steps:
      - uses: TheDemonTuan/vps-deploy/.github/actions/deploy@c3c8131b78c1456f37da3b6646101bbdb9069c0b
        with:
          app: 9router
          host: oracle-main
          operation: ${{ inputs.operation }}
          component: ${{ inputs.component }}
          source-sha: ${{ github.sha }}
          platform-ref: c3c8131b78c1456f37da3b6646101bbdb9069c0b
          config: .deploy/app.yml
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
