name: VPS deployment operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Status, rollback to retained previous slot, or explicit recovery
        required: true
        type: choice
        options: [status, rollback, reconcile]
      component:
        description: Component (rollback supports app only)
        required: true
        type: choice
        options: [app, rtk]

permissions:
  contents: read

jobs:
  operate:
    concurrency:
      group: ${{ inputs.operation == 'status' && format('9router-status-{0}', github.run_id) || '9router-oracle-main-production' }}
      queue: max
      cancel-in-progress: false
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (inputs.operation != 'rollback' || inputs.component == 'app')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 17
    steps:
      - uses: TheDemonTuan/vps-deploy/.github/actions/deploy@04e99424be880398513300e23162ff840d757dd9
        with:
          app: 9router
          host: oracle-main
          operation: ${{ inputs.operation }}
          component: ${{ inputs.component }}
          source-sha: ${{ github.sha }}
          platform-ref: 04e99424be880398513300e23162ff840d757dd9
          config: .deploy/app.yml
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
