name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: decolua/9router

jobs:
  verify:
    name: Offline verification
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install runtime dependencies
        run: bun install --frozen-lockfile
      - name: Install test dependencies
        working-directory: tests
        run: bun install --frozen-lockfile
      - name: Run Responses and ChatGPT Web verification
        working-directory: tests
        run: |
          set -euo pipefail
          response_tests="$(find unit translator -type f -name '*responses*.test.js' ! -path '*/real/*' | sort)"
          chatgpt_web_tests="$(find unit integration -type f -name '*chatgpt*.test.js' ! -path '*/real/*' | sort)"
          printf 'Responses regression gate:\n%s\n' "$response_tests"
          printf 'ChatGPT Web regression gate:\n%s\n' "$chatgpt_web_tests"
          bun x vitest run --config vitest.config.js \
            $response_tests \
            $chatgpt_web_tests \
            unit/alibaba-token-plan-thinking.test.js \
            unit/alibaba-token-plan-catalog.test.js \
            unit/alibaba-token-plan-capabilities.test.js \
            unit/alibaba-token-plan-models-route.test.js \
            unit/alibaba-token-plan-provider.test.js \
            translator/alibaba-token-plan-pipeline.test.js
          set +e
          bun x vitest run --config vitest.config.js translator/alibaba-token-plan-pipeline.test.js --reporter=json --outputFile=translator-results.json
          vitest_status=$?
          set -e
          node __baseline__/verify-no-regression.mjs translator-results.json
          if [ "$vitest_status" -ne 0 ]; then
            echo "Known baseline failures verified; no new translator regression."
          fi
          node __baseline__/verify-providers.mjs
          node __baseline__/verify-alias.mjs
          node __baseline__/verify-oauth-urls.mjs

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
