<!doctype html><html><head><meta charset="utf-8"><title>Synthetic ChatGPT runtime fixture</title><style>body{font:16px sans-serif}#prompt-textarea{white-space:pre-wrap;border:1px solid #aaa;min-height:100px}#picker{width:320px;padding:16px}button{padding:8px}span[role=slider]{display:inline-block;width:12px;height:12px}</style></head><body><main id="turns"></main><form data-chatgpt-composer><div id="prompt-textarea" data-testid="prompt-textarea" contenteditable="true" role="textbox" data-lexical-editor="true">Stale draft must be cleared</div><button type="button" data-tone="neutral" aria-haspopup="menu" aria-controls="picker" aria-expanded="false">5.6 Sol Instant</button><button data-testid="send-button" type="submit">Send</button></form><div id="picker" role="menu" hidden><div data-model-picker-view="advanced"><div role="menuitem" aria-expanded="true" aria-hidden="false" data-model-picker-view-toggle="true">Select model</div><div id="families"><div role="menuitemradio" aria-checked="true">GPT-5.6 Sol</div></div><span id="announcement">5.6 Sol Instant, 1 of 3.</span><div role="menuitem" tabindex="0" aria-describedby="announcement"><div data-model-picker-power-slider style="height:30px;width:250px"><span data-orientation="horizontal" aria-disabled="false"></span></div></div></div></div><script>
let value=0, sends=0, generation=0;
const composer=document.querySelector('#prompt-textarea'),control=document.querySelector('button[aria-haspopup]'),menu=document.querySelector('#picker'),form=document.querySelector('form'),sliderHost=document.querySelector('[data-model-picker-power-slider]>span');
const loginFixture={composerDelayMs:0,pointerOnly:false,semanticSlider:false,headerOnlyModel:false,...window.__cgwLoginFixture};
if(loginFixture.composerDelayMs>0){form.hidden=true;setTimeout(()=>{form.hidden=false;},loginFixture.composerDelayMs);}
const keyboardOwner=sliderHost.closest('[role=menuitem]'),pickerHeader=menu.querySelector('[data-model-picker-view-toggle]');
window.fixture={sends:0,prompts:[],selectedEfforts:[],expired:false,rateLimited:false};
function render(){const mode=['Instant','Medium','High'][value];sliderHost.innerHTML=Array.from({length:3},(_,i)=>'<span data-selected="'+(i<=value)+'"></span>').join('')+'<span role="slider" tabindex="'+(loginFixture.semanticSlider?'-1':'0')+'" aria-hidden="true" '+(loginFixture.semanticSlider?'style="width:0;height:0" ':'')+'aria-valuemin="0" aria-valuemax="2" aria-valuenow="'+value+'"></span>';document.querySelector('#announcement').textContent=(loginFixture.headerOnlyModel?'':'5.6 Sol ')+mode+', '+(value+1)+' of 3.';if(loginFixture.headerOnlyModel){const content=document.createElement('span');content.setAttribute('data-menu-row-content','');content.append(document.createTextNode('5.6'),document.createTextNode(' Sol'),document.createTextNode(' '+mode));pickerHeader.replaceChildren(content);}}
function open(){menu.hidden=false;control.setAttribute('aria-expanded','true');render();}
if(loginFixture.pointerOnly)control.addEventListener('pointerdown',e=>{if(e.button===0&&e.isPrimary)open();});else control.addEventListener('click',open);document.querySelector('[role=menuitemradio]').onclick=()=>{};
function arrow(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){value=Math.max(0,Math.min(2,value+(e.key==='ArrowRight'?1:-1)));render();e.preventDefault();}}
if(loginFixture.semanticSlider)keyboardOwner.addEventListener('keydown',e=>{if(e.target===keyboardOwner)arrow(e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.hidden=true;control.setAttribute('aria-expanded','false');control.textContent='5.6 Sol '+['Instant','Medium','High'][value];}else if(!loginFixture.semanticSlider)arrow(e);});
function clientDecision(prompt){
  const serialized=/<codex_context_json>\s*([\s\S]*?)\s*<\/codex_context_json>/.exec(prompt)?.[1];
  if(!serialized)return;
  const context=JSON.parse(serialized);if(!context.clientTools)return;
  const results=context.messages.filter(message=>message.role==='tool_result');
  const names=results.map(message=>message.tool_name||message.toolName||message.name);
  const calls=context.messages.flatMap(message=>message.content||[]).filter(part=>part.type==='tool_call');
  const completed=calls.slice(0,results.length).map(call=>call.name);
  const used=[...names,...completed];
  let decision=used.includes('Exec')?{content:'CGW_CLIENT_TOOLS_OK',tool_calls:[]}
    :used.includes('Edit')?{content:null,tool_calls:[{name:'Exec',arguments:{command:'bun fixture.test.mjs'}}]}
    :used.includes('Read')?{content:null,tool_calls:[{name:'Edit',arguments:{path:'fixture.mjs',old_text:'return a - b;',new_text:'return a + b;'}}]}
    :{content:null,tool_calls:[{name:'Read',arguments:{path:'fixture.mjs'}}]};
  const config=window.__cgwClientToolsFixture||{};
  if(config.malformed)return 'malformed client envelope';
  if(config.parallel)decision={content:null,tool_calls:[{name:'Read',arguments:{path:'fixture.mjs'}},{name:'Read',arguments:{path:'fixture.test.mjs'}}]};
  if(config.final||context.clientTools.toolChoice==='none')decision={content:'CGW_CLIENT_TOOLS_OK',tool_calls:[]};
  return JSON.stringify(decision);
}
form.addEventListener('submit',event=>{
  const prompt=composer.innerText,decision=clientDecision(prompt);if(decision===undefined)return;
  event.preventDefault();event.stopImmediatePropagation();window.fixture.sends++;window.fixture.prompts.push(prompt);window.fixture.selectedEfforts.push(value);composer.innerHTML='';
  const key='client-'+(++sends),wrapper=document.createElement('div');wrapper.setAttribute('data-turn-key',key);
  const user=document.createElement('div');user.setAttribute('data-user-message-bubble','');const source=document.createElement('div');source.setAttribute('data-search-result-target','');source.style.whiteSpace='pre-wrap';source.textContent=prompt;user.append(source);wrapper.append(user);
  const answer=document.createElement('div');answer.setAttribute('data-content-search-unit-key',key+':assistant');answer.innerHTML='<div data-conversation-role="assistant"></div><div data-markdown-text-style="assistant-message"><pre><code class="language-json"></code></pre></div>';wrapper.append(answer);document.querySelector('#turns').append(wrapper);
  const stop=document.createElement('button');stop.type='button';stop.setAttribute('data-testid','stop-button');stop.textContent='Stop';form.append(stop);
  setTimeout(()=>{answer.querySelector('code').textContent=decision;stop.remove();const controls=document.createElement('div');controls.className='turn-action-controls';controls.innerHTML='<button data-testid="copy-turn-action-button">Copy</button>';wrapper.append(controls);generation++;},150);
},true);
form.addEventListener('submit',e=>{e.preventDefault();const prompt=composer.innerText;if(!prompt.trim())return;window.fixture.sends++;window.fixture.prompts.push(prompt);window.fixture.selectedEfforts.push(value);composer.innerText='';const number=++sends,key='fixture-'+number,wrapper=document.createElement('div');wrapper.setAttribute('data-turn-key',key);const user=document.createElement('div');user.setAttribute('data-user-message-bubble','');const source=document.createElement('div');source.setAttribute('data-search-result-target','');source.style.whiteSpace='pre-wrap';source.textContent=prompt;user.append(source);wrapper.append(user);const answer=document.createElement('div');answer.setAttribute('data-content-search-unit-key',key+':assistant');answer.innerHTML='<div data-conversation-role="assistant"></div><div data-markdown-text-style="assistant-message"><p>Offline answer first paragraph.</p></div>';wrapper.append(answer);document.querySelector('#turns').append(wrapper);const stop=document.createElement('button');stop.type='button';stop.setAttribute('data-testid','stop-button');stop.textContent='Stop';form.append(stop);setTimeout(()=>{answer.querySelector('[data-markdown-text-style]').innerHTML+='<p>Offline answer second paragraph.</p>';},150);setTimeout(()=>{stop.remove();const controls=document.createElement('div');controls.className='turn-action-controls';controls.innerHTML='<button type="button" data-testid="copy-turn-action-button">Copy</button>';wrapper.append(controls);generation++;},400);});render();
</script></body></html>
<script>
const mention=document.createElement('div');mention.hidden=true;mention.setAttribute('data-mention-list-scroll-area','');mention.innerHTML='<button type="button" data-list-navigation-item="true" data-highlighted="true"><span>Codex Native2</span></button>';document.body.append(mention);
composer.addEventListener('input',()=>{mention.hidden=!composer.innerText.startsWith('@codex');});
document.addEventListener('keydown',event=>{if(event.key==='Escape')mention.hidden=true;if(event.key==='Enter'&&!mention.hidden){event.preventDefault();composer.innerHTML='<span contenteditable="false" data-id="plugin:synthetic" data-keyword="Codex Native2">Codex Native2</span>';mention.hidden=true;}});
form.addEventListener('submit',event=>{
  if(typeof window.syntheticMcpCall!=='function'||! /turn_[A-Za-z0-9_-]{32}/.test(composer.innerText))return;
  event.preventDefault();event.stopImmediatePropagation();
  const prompt=composer.innerText,token=/turn_[A-Za-z0-9_-]{32}/.exec(prompt)?.[0];
  window.fixture.sends++;window.fixture.prompts.push(prompt);window.fixture.selectedEfforts.push(value);composer.innerHTML='';
  const wrapper=document.createElement('div');wrapper.setAttribute('data-turn-key','harness-response');
  const user=document.createElement('div');user.setAttribute('data-user-message-bubble','');const source=document.createElement('div');source.setAttribute('data-search-result-target','');source.style.whiteSpace='pre-wrap';source.textContent=prompt;user.append(source);wrapper.append(user);
  const answer=document.createElement('div');answer.setAttribute('data-content-search-unit-key','harness-response:assistant');answer.innerHTML='<div data-conversation-role="assistant"></div><div data-markdown-text-style="assistant-message"><p>Reading the synthetic local fixture.</p></div>';wrapper.append(answer);document.querySelector('#turns').append(wrapper);
  const stop=document.createElement('button');stop.type='button';stop.setAttribute('data-testid','stop-button');stop.textContent='Stop';form.append(stop);
  (async()=>{try{const first=await window.syntheticMcpCall({name:'codex_tool_call',arguments:{turn_token:token,wire_name:'fixture__read',arguments:{path:'synthetic.txt'}}});const second=await window.syntheticMcpCall({name:'codex_apply_patch',arguments:{turn_token:token,patch:'*** Begin Patch\n*** Add File: synthetic-fixed.txt\n+fixed\n*** End Patch'}});window.fixture.mcpResults=[first,second];answer.querySelector('[data-markdown-text-style]').innerHTML='<p>Read synthetic.txt and applied the local fixture patch.</p>';}catch(error){answer.querySelector('[data-markdown-text-style]').innerHTML='<p>Synthetic MCP error.</p>';window.fixture.mcpError=String(error);}finally{stop.remove();const controls=document.createElement('div');controls.className='turn-action-controls';controls.innerHTML='<button data-testid="copy-turn-action-button">Copy</button>';wrapper.append(controls);}})();
},true);
</script>
